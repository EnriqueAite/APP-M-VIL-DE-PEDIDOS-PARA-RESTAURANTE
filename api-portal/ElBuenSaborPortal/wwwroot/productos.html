<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — El Buen Sabor</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <span>🍽 El Buen Sabor</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="productos.html" class="activo">Productos</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="clientes.html">Clientes</a>
        <a href="perfil.html">Perfil</a>
        <a href="#" class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</a>
    </nav>

    <div class="contenedor">
        <h1>Gestión de Productos</h1>

        <div class="barra">
            <input type="text" id="buscador"
                   placeholder="🔍 Buscar producto..."
                   oninput="filtrarTabla()">
            <button class="btn btn-verde" onclick="abrirModalNuevo()">
                + Nuevo producto
            </button>
        </div>

        <div class="filtros">
            <button class="filtro activo"
                    onclick="filtrarCategoria('todos', this)">
                Todos
            </button>
            <button class="filtro"
                    onclick="filtrarCategoria('carnes', this)">
                Carnes
            </button>
            <button class="filtro"
                    onclick="filtrarCategoria('pescados', this)">
                Pescados
            </button>
            <button class="filtro"
                    onclick="filtrarCategoria('ensaladas', this)">
                Ensaladas
            </button>
            <button class="filtro"
                    onclick="filtrarCategoria('bebidas', this)">
                Bebidas
            </button>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal nuevo/editar producto -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-titulo">Nuevo producto</h2>
            <input type="hidden" id="prod-id">
            <input type="hidden" id="prod-imagen-url">

            <div class="campo">
                <label>Imagen del producto</label>
                <div class="preview-imagen" id="preview-imagen">
                    <span id="preview-texto">Sin imagen</span>
                    <img id="preview-img" style="display:none">
                </div>
                <input type="file" id="prod-imagen" accept="image/*"
                       onchange="previsualizarImagen(event)">
            </div>

            <div class="campo">
                <label>Nombre</label>
                <input type="text" id="prod-nombre"
                       placeholder="Ej: Lomo Saltado">
            </div>
            <div class="campo">
                <label>Descripción</label>
                <input type="text" id="prod-descripcion"
                       placeholder="Ej: Con papas fritas y arroz">
            </div>
            <div class="campo">
                <label>Categoría</label>
                <select id="prod-categoria"></select>
            </div>
            <div class="campo">
                <label>Precio (S/)</label>
                <input type="number" id="prod-precio"
                       placeholder="0.00" step="0.01" min="0">
            </div>

            <div class="modal-botones">
                <button class="btn"
                        onclick="cerrarModal()"
                        style="background:#EEEEEE;color:#333">
                    Cancelar
                </button>
                <button class="btn btn-primary" onclick="guardarProducto()"
                        id="btn-guardar">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!sessionStorage.getItem("admin")) {
            window.location.href = "index.html";
        }

        function cerrarSesion() {
            sessionStorage.removeItem("admin");
            window.location.href = "index.html";
        }

        let productos   = [];
        let categorias  = [];
        let categoriaFiltro = "todos";
        let archivoSeleccionado = null;

        async function cargarDatos() {
            const [resProd, resCat] = await Promise.all([
                fetch(`${API_URL}/productos`),
                fetch(`${API_URL}/categorias`)
            ]);
            productos  = await resProd.json();
            categorias = await resCat.json();
            renderTabla(productos);
            cargarSelectCategoria();
        }

        function cargarSelectCategoria() {
            const select = document.getElementById("prod-categoria");
            select.innerHTML = categorias.map(c =>
                `<option value="${c.idCategoria}">${c.nombre}</option>`
            ).join("");
        }

        function renderTabla(lista) {
            const tbody = document.getElementById("tabla-productos");
            tbody.innerHTML = lista.map(p => `
                <tr>
                    <td>
						${p.imagenUrl
							? `<img src="http://localhost:5087${p.imagenUrl}" class="img-tabla">`
							: `<div class="img-tabla img-vacia">🍽</div>`}
                    </td>
                    <td>${p.nombre}</td>
                    <td>${p.descripcion ?? "—"}</td>
                    <td>${p.categoria?.nombre ?? "—"}</td>
                    <td>S/ ${Number(p.precio).toFixed(2)}</td>
                    <td style="display:flex;gap:8px">
                        <button class="btn btn-editar"
                            onclick="abrirModalEditar(${p.idProducto})">
                            Editar
                        </button>
                        <button class="btn btn-borrar"
                            onclick="eliminarProducto(${p.idProducto})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        function filtrarTabla() {
            const q = document.getElementById("buscador")
                .value.toLowerCase();
            let lista = productos.filter(p =>
                p.nombre.toLowerCase().includes(q));
            if (categoriaFiltro !== "todos") {
                lista = lista.filter(p =>
                    p.categoria?.nombre === categoriaFiltro);
            }
            renderTabla(lista);
        }

        function filtrarCategoria(cat, btn) {
            categoriaFiltro = cat;
            document.querySelectorAll(".filtro")
                .forEach(b => b.classList.remove("activo"));
            btn.classList.add("activo");
            filtrarTabla();
        }

        function abrirModalNuevo() {
            document.getElementById("modal-titulo").textContent =
                "Nuevo producto";
            document.getElementById("prod-id").value          = "";
            document.getElementById("prod-imagen-url").value  = "";
            document.getElementById("prod-nombre").value      = "";
            document.getElementById("prod-descripcion").value = "";
            document.getElementById("prod-precio").value      = "";
            document.getElementById("prod-imagen").value      = "";
            archivoSeleccionado = null;
            resetearPreview();
            document.getElementById("modal").classList.add("visible");
        }

        function abrirModalEditar(id) {
            const p = productos.find(x => x.idProducto === id);
            if (!p) return;
            document.getElementById("modal-titulo").textContent =
                "Editar producto";
            document.getElementById("prod-id").value         = p.idProducto;
            document.getElementById("prod-imagen-url").value = p.imagenUrl ?? "";
            document.getElementById("prod-nombre").value      = p.nombre;
            document.getElementById("prod-descripcion").value =
                p.descripcion ?? "";
            document.getElementById("prod-categoria").value = p.idCategoria;
            document.getElementById("prod-precio").value    = p.precio;
            document.getElementById("prod-imagen").value    = "";
            archivoSeleccionado = null;

            if (p.imagenUrl) {
                document.getElementById("preview-img").src = `http://localhost:5087${p.imagenUrl}`;
                document.getElementById("preview-img").style.display = "block";
                document.getElementById("preview-texto").style.display = "none";
            } else {
                resetearPreview();
            }

            document.getElementById("modal").classList.add("visible");
        }

        function resetearPreview() {
            document.getElementById("preview-img").style.display = "none";
            document.getElementById("preview-img").src = "";
            document.getElementById("preview-texto").style.display = "block";
        }

        function previsualizarImagen(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;
            archivoSeleccionado = archivo;

            const lector = new FileReader();
            lector.onload = e => {
                document.getElementById("preview-img").src = e.target.result;
                document.getElementById("preview-img").style.display = "block";
                document.getElementById("preview-texto").style.display = "none";
            };
            lector.readAsDataURL(archivo);
        }

        function cerrarModal() {
            document.getElementById("modal").classList.remove("visible");
        }

        async function guardarProducto() {
            const btnGuardar = document.getElementById("btn-guardar");
            const id          = document.getElementById("prod-id").value;
            const nombre      = document.getElementById("prod-nombre")
                .value.trim();
            const descripcion = document.getElementById("prod-descripcion")
                .value.trim();
            const idCategoria = parseInt(
                document.getElementById("prod-categoria").value);
            const precio      = parseFloat(
                document.getElementById("prod-precio").value);
            let imagenUrl     = document.getElementById("prod-imagen-url").value;

            if (!nombre || !precio) return;

            btnGuardar.textContent = "Guardando...";
            btnGuardar.disabled = true;

            // Si seleccionó una imagen nueva, primero la subimos
            if (archivoSeleccionado) {
                const formData = new FormData();
                formData.append("archivo", archivoSeleccionado);

                const resImagen = await fetch(`${API_URL}/imagenes/subir`, {
                    method: "POST",
                    body: formData
                });

                if (resImagen.ok) {
                    const data = await resImagen.json();
                    imagenUrl = data.url;
                } else {
                    alert("No se pudo subir la imagen");
                    btnGuardar.textContent = "Guardar";
                    btnGuardar.disabled = false;
                    return;
                }
            }

            const cuerpo = { nombre, descripcion, idCategoria, precio,
                imagenUrl, activo: true };

            if (id) {
                await fetch(`${API_URL}/productos/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ idProducto: parseInt(id),
                        ...cuerpo })
                });
            } else {
                await fetch(`${API_URL}/productos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(cuerpo)
                });
            }

            btnGuardar.textContent = "Guardar";
            btnGuardar.disabled = false;
            cerrarModal();
            cargarDatos();
        }

        async function eliminarProducto(id) {
            await fetch(`${API_URL}/productos/${id}`, { method: "DELETE" });
            cargarDatos();
        }

        cargarDatos();
    </script>
</body>
</html>
